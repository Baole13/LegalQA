<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trợ lý pháp lý LegalQA</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="chat" aria-label="Trợ lý hỏi đáp pháp lý">
        <header class="topbar">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">LQ</span>
            <div>
              <h1>Trợ lý pháp lý</h1>
              <p>Hỏi đáp dựa trên căn cứ pháp luật</p>
            </div>
          </div>
          <span class="connection-status" id="health-status" role="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="health-label">Đang kết nối</span>
          </span>
        </header>

        <section class="thread" id="thread" aria-live="polite">
          <article class="message assistant">
            <div class="avatar" aria-hidden="true">LQ</div>
            <div class="message-body">
              <p class="message-author">Trợ lý pháp lý</p>
              <p>Bạn hãy nhập câu hỏi. Tôi sẽ trả lời ngắn gọn và đính kèm căn cứ pháp lý khi tìm thấy thông tin phù hợp.</p>
            </div>
          </article>
        </section>

        <footer class="composer">
          <label class="sr-only" for="question">Nhập câu hỏi pháp lý</label>
          <div class="input-wrap">
            <textarea id="question" rows="2" placeholder="Nhập câu hỏi pháp lý..."></textarea>
            <button id="ask-btn" class="send-button" type="button" aria-label="Gửi câu hỏi" title="Gửi câu hỏi">
              <span>Gửi</span><span class="send-icon" aria-hidden="true">↑</span>
            </button>
          </div>
          <div class="composer-meta">
            <span id="request-state" role="status">Sẵn sàng</span>
            <span>Nhấn Ctrl/Cmd + Enter để gửi</span>
          </div>
        </footer>
      </section>
    </main>

    <div class="detail-modal hidden" id="detail-modal" aria-hidden="true">
      <div class="detail-backdrop" id="detail-backdrop"></div>
      <section class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detail-title">
        <header class="detail-header">
          <div>
            <p class="detail-label">Chi tiết căn cứ</p>
            <h2 id="detail-title">Căn cứ pháp lý</h2>
          </div>
          <button id="detail-close" class="close-button" type="button" aria-label="Đóng chi tiết" title="Đóng">×</button>
        </header>
        <p class="detail-meta" id="detail-meta">Không có dữ liệu.</p>
        <pre class="detail-body" id="detail-body"></pre>
      </section>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
